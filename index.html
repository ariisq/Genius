<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catatan Lirik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" integrity="sha384-5TcZemv2l/9On385z///+d7MSYlvIEw9FuZTIdZ14vJLqWphw7e7ZPuOiCHJcFCP" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" integrity="sha384-cMkvdD8LoxVzGF/RPUKAcvmm49FQ0oxwDF3BGKtDXcEc+T1b2N+teh/OJfpU0jr6" crossorigin="anonymous"></script>
<style>
:root{--paper:#fff;--card:#fff;--ink:#000;--muted:#757575;--line:#e1e1e1;--mark:#fff8a6;--mark-on:#ffff64;--accent:#ffff64;--accent-ink:#000;--danger:#c0201b;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#121212;--card:#1d1d1d;--ink:#f5f5f5;--muted:#a3a3a3;--line:#333;--mark:#4d4a00;--mark-on:#7d7800;--danger:#ff8a80}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header.top{background:#fff}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{background:#ffff64;color:#000;font-weight:800;font-size:1rem;letter-spacing:-.02em;text-decoration:none;padding:4px 10px;border-radius:2px}
main{padding:32px 0 140px;min-height:70vh}
h1{font-size:clamp(1.9rem,5vw,2.9rem);font-weight:800;line-height:1.05;margin:0 0 6px;letter-spacing:-.035em}
h2{font-size:1.15rem;font-weight:800;margin:40px 0 12px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink);background:transparent;padding:8px 16px;border-radius:3px;cursor:pointer;text-decoration:none;display:inline-block;font-weight:600;font-size:.92rem}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink)}
.btn.primary:hover{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--line)}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.back{display:inline-block;margin-bottom:20px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.92rem}
.back:hover{color:var(--ink);text-decoration:underline}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:26px}

/* album grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:26px 18px}
.album{text-decoration:none;display:block}
.album .cv{aspect-ratio:1;width:100%;border-radius:2px;overflow:hidden}
.album:hover .cv{outline:3px solid #ffff64}
.album b{display:block;margin-top:9px;line-height:1.25;font-weight:700}
.album:hover b{text-decoration:underline}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv.ph{display:grid;place-items:center;font-weight:800;font-size:3rem;color:#fff}
.empty{border:2px dashed var(--line);border-radius:4px;padding:34px 20px;text-align:center;color:var(--muted)}

/* album + song header */
.ahead,.shead{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;margin-bottom:28px}
.ahead .cv,.shead .cv{width:min(200px,100%);aspect-ratio:1;border-radius:2px;overflow:hidden;flex:none}
.shead .cv{width:min(150px,34vw)}
.songs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);counter-reset:s}
.songs li a{display:flex;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:500}
.songs li a::before{counter-increment:s;content:counter(s);width:1.6rem;color:var(--muted);font-weight:400;flex:none}
.songs li a span:first-child{flex:1}
.songs li a:hover span:first-child{text-decoration:underline}
.songs .n{font-size:.9rem;font-weight:400}

/* song page */
.lyrics{font-size:1.06rem;line-height:1.95;white-space:pre-wrap;max-width:36rem;margin:30px 0 0;overflow-wrap:anywhere}
mark.note{background:var(--mark);color:inherit;padding:.12em 0;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.note:hover,mark.note.on{background:var(--mark-on)}
.hint{max-width:36rem;font-size:.92rem;color:var(--muted);margin:14px 0 0}
.nlist{list-style:none;margin:0;padding:0;max-width:36rem}
.nlist li{border-top:1px solid var(--line)}
.nlist button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 2px;cursor:pointer}
.nlist button:hover .q{background:var(--mark-on)}
.nlist .q{font-weight:700;background:var(--mark);padding:.05em .15em}
.nlist .t{color:var(--muted);font-size:.95rem;display:block;margin-top:4px}

/* floating bars */
#selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;display:flex;gap:12px;align-items:center;
  background:#000;color:#fff;padding:8px 8px 8px 16px;border-radius:999px;max-width:calc(100vw - 24px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
#selbar[hidden]{display:none}
#selbar span{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
#selbar button{border:0;border-radius:999px;background:#ffff64;color:#000;font-weight:800;padding:8px 16px;cursor:pointer;white-space:nowrap}
#sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100vw);z-index:40;background:var(--card);
  border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:18px 20px 20px;box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:62vh;overflow:auto}
#sheet[hidden]{display:none}
#sheet::before{content:"Catatan";display:block;font-weight:800;font-size:.8rem;margin-bottom:10px}
#sheet .q{font-weight:700;font-size:1.02rem;margin:0 0 12px;padding:2px 0 2px 12px;border-left:4px solid var(--mark-on)}
#sheet .t{margin:0 0 16px;line-height:1.65}
@media (min-width:1040px){#sheet{left:auto;bottom:auto;transform:none;right:calc((100vw - 980px)/2 + 18px);top:92px;width:340px;max-height:calc(100vh - 124px);
  border-bottom:1px solid var(--line);border-radius:4px;box-shadow:0 2px 16px rgba(0,0,0,.14)}}

/* dialog + form */
dialog{border:0;border-radius:6px;background:var(--card);color:var(--ink);width:min(560px,calc(100vw - 24px));padding:22px;box-shadow:0 12px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 14px;font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
label{display:block;font-weight:700;font-size:.88rem;margin:14px 0 5px}
input[type=text],input[type=password],textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:9px 11px;background:var(--paper)}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--ink);outline:0}
textarea{resize:vertical;line-height:1.5}
.cprev{width:120px;aspect-ratio:1;border:1px dashed var(--line);border-radius:3px;display:grid;place-items:center;font-size:.8rem;color:var(--muted);overflow:hidden;margin-bottom:8px;text-align:center}
.cprev img{width:100%;height:100%;object-fit:cover}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

/* editor catatan: tebal, miring, tautan, foto */
.rte{border:1px solid var(--line);border-radius:3px;background:var(--paper)}
.rte:focus-within{border-color:var(--ink)}
.tb{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tb button{border:0;background:none;min-width:36px;height:34px;padding:0 10px;border-radius:3px;cursor:pointer;font-size:.9rem;font-weight:600}
.tb button:hover{background:var(--mark-on);color:#000}
.lnk{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
.lnk[hidden]{display:none}
.ed{min-height:150px;max-height:46vh;overflow:auto;padding:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;outline:0}
.ed:empty::before{content:attr(data-ph);color:var(--muted)}
.ed img,.rt img{max-width:100%;height:auto;display:block;margin:8px 0;border-radius:3px}
.ed a,.rt a{text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--mark-on);text-underline-offset:2px}
.rt{overflow-wrap:anywhere;white-space:pre-wrap}

.ed h2,.rt h2{font-size:1.25rem;font-weight:800;margin:12px 0 6px;letter-spacing:-.01em}
.ed h3,.rt h3{font-size:1.05rem;font-weight:800;margin:10px 0 4px}
.ed blockquote,.rt blockquote{margin:8px 0;padding:2px 0 2px 12px;border-left:4px solid var(--mark-on);color:var(--muted)}
.ed pre,.rt pre{background:var(--line);padding:10px 12px;border-radius:3px;overflow:auto;margin:8px 0;white-space:pre-wrap;font:.85rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ed code,.rt code{background:var(--line);padding:.1em .35em;border-radius:3px;font:.88em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ed pre code,.rt pre code{background:none;padding:0}
.ed ul,.rt ul,.ed ol,.rt ol{margin:6px 0;padding-left:22px}
.ed p,.rt p{margin:0}
.mth{display:inline-block;max-width:100%;overflow-x:auto;vertical-align:middle}
.mth[data-d]{display:block;text-align:center;margin:8px 0}
.ed .mth{cursor:pointer;padding:0 2px;outline:1px dashed var(--line);border-radius:2px}
.mrow{padding:8px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.mrow[hidden]{display:none}
.mrow .pv{min-height:2.2em;padding:4px 8px;background:var(--card);border-radius:3px;overflow-x:auto}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:none;border-radius:3px;padding:3px 9px;cursor:pointer;font-size:.88rem}
.chips button:hover{background:var(--mark-on);color:#000}
.sel{border:1px solid var(--line);background:var(--paper);border-radius:3px;height:34px;padding:0 6px}
.cl{display:inline-flex;align-items:center;gap:4px;margin:0;font-size:.82rem;font-weight:600;cursor:pointer;padding:0 6px;min-height:34px}
.cl input[type=color]{width:26px;height:22px;border:0;padding:0;background:none}
.tb+.tb{border-top:0;padding-top:0}
footer{background:#fff;color:#b5b5b5;padding:22px 0 48px;font-size:.9rem}
footer .btn{color:#000;border-color:#555}
footer .btn:hover{background:#fff;color:#000}
footer .btn.primary{background:#ffff64;color:#000;border-color:#ffff64}
footer p{margin:12px 0 0}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:4px;z-index:100;max-width:calc(100vw - 24px)}
#toast[hidden]{display:none}
#kq{margin-top:10px}#kq input{max-width:260px}#kq[hidden]{display:none}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="#/">Catatan Lirik</a></div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">
  <div class="row">
    <button class="btn ghost" id="exp" type="button">Simpan cadangan (.json)</button>
    <button class="btn ghost" id="imp" type="button">Pulihkan cadangan</button>
    <input type="file" id="impfile" accept="application/json,.json" hidden>
  </div>
  <p id="sy">Menghubungkan…</p>
  <div class="row" id="kq" hidden><input type="password" id="kk" placeholder="Kata sandi sinkron" autocomplete="off"><button class="btn primary" id="ks" type="button">Simpan</button></div>
  <p>Data disimpan di browser ini dan disinkronkan lewat server. File cadangan (.json) tetap berguna sebagai arsip.</p>
</div></footer>

<div id="selbar" hidden><span id="selprev"></span><button type="button" id="selbtn">Beri catatan</button></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
var KEY='catatan-lirik-v1';
var $=function(s){return document.querySelector(s)};
var app=$('#app');

/* ---------- helpers ---------- */
function h(tag,attrs){
  var e=document.createElement(tag);
  attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){
    var v=attrs[k];
    if(k==='class')e.className=v;
    else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v);
  });
  Array.prototype.slice.call(arguments,2).forEach(function add(c){
    if(c==null||c===false)return;
    if(Array.isArray(c))return c.forEach(add);
    e.append(c.nodeType?c:document.createTextNode(String(c)));
  });
  return e;
}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36)}
var toastTimer;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},3500)}

/* ---------- data ---------- */
function sample(){
  var lyr="I walk alone when the city sleeps\nThe streetlights count my steps\nI don't know where I'm going\nBut I'm not afraid anymore";
  var q="I'm not afraid anymore", s=lyr.indexOf(q);
  var q2="count my steps", s2=lyr.indexOf(q2);
  return {
    albums:[{id:'a1',title:'Contoh Album',artist:'Nama Artis',cover:null}],
    songs:[{id:'s1',albumId:'a1',title:'Contoh Lagu (tulisan sendiri)',lyrics:lyr,notes:[
      {id:'n1',start:s2,end:s2+q2.length,quote:q2,text:'"menghitung langkahku". Lampu jalan seolah-olah ikut menghitung langkah. Ini gaya bahasa personifikasi.'},
      {id:'n2',start:s,end:s+q.length,quote:q,text:'"Aku sudah tidak takut lagi."\nanymore = lagi (dipakai di kalimat negatif, artinya "tidak ... lagi").'}
    ]}]
  };
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.albums)&&Array.isArray(d.songs))return d}}catch(e){}
  return sample();
}
var db=load();
function save(){
  stamp();
  if(!persist())toast('Penyimpanan penuh atau diblokir. Simpan cadangan (.json) dulu.');
  queue();
}
var albumById=function(id){return db.albums.filter(function(a){return a.id===id})[0]};
var songById=function(id){return db.songs.filter(function(s){return s.id===id})[0]};

/* ---------- cover ---------- */
function toCover(file){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var S=480,c=document.createElement('canvas'),side=Math.min(img.width,img.height);
      c.width=c.height=S;
      c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=function(){rej(new Error('bad image'))};
    img.src=url;
  });
}
function coverEl(a){
  if(a.cover)return h('div',{class:'cv'},h('img',{src:a.cover,alt:'Cover '+a.title}));
  var hue=0;for(var i=0;i<a.title.length;i++)hue=(hue*31+a.title.charCodeAt(i))%360;
  return h('div',{class:'cv ph',style:'background:hsl('+hue+',38%,34%)','aria-hidden':'true'},(a.title[0]||'?').toUpperCase());
}

  function fixLink(u){u=(u||'').trim();if(!u)return '';return /^https?:\/\//i.test(u)?u:'https://'+u}
function linkBtn(a){
  if(!a||!/^https?:\/\//i.test(a.link||''))return null;
  return h('a',{class:'btn',href:a.link,target:'_blank',rel:'noopener noreferrer',title:'Buka tautan album'},'Buka tautan ↗');
}
  
/* ---------- teks kaya: aman (format ala Word, rumus, tautan, foto) ---------- */
var OKIMG=/^(data:image\/(png|jpe?g|gif|webp);base64,|https?:\/\/)/i;
var COLOR=/^(#[0-9a-f]{3,8}|rgba?\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*(,\s*[\d.]+\s*)?\))$/i;
var TAGS={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',S:'s',STRIKE:'s',DEL:'s',SUB:'sub',SUP:'sup',CODE:'code',H1:'h2',H2:'h2',H3:'h3',BLOCKQUOTE:'blockquote',PRE:'pre',UL:'ul',OL:'ol',LI:'li',P:'p',DIV:'div',SPAN:'span',FONT:'span'};
function link(u,txt){var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener noreferrer';if(txt!=null)a.textContent=txt;return a}
function styled(c,e){
  var s=c.style||{},col=s.color||(c.tagName==='FONT'?c.getAttribute('color'):'')||'',bg=s.backgroundColor||'',al=s.textAlign||'';
  if(COLOR.test(col))e.style.color=col;
  if(COLOR.test(bg))e.style.backgroundColor=bg;
  if(/^(left|center|right|justify)$/.test(al))e.style.textAlign=al;
}
function renderMath(m){
  var tex=m.getAttribute('data-tex');
  if(tex==null||m.getAttribute('data-ok'))return;
  if(!window.katex){m.textContent=tex;return}
  try{window.katex.render(tex,m,{throwOnError:false,displayMode:m.hasAttribute('data-d')});m.setAttribute('data-ok','1')}catch(e){m.textContent=tex}
}
function mathEl(tex,d,mode){
  var m=document.createElement(mode==='store'?'m':'span');
  if(d)m.setAttribute('data-d','');
  if(mode==='store'){m.textContent=tex;return m}
  m.className='mth';m.setAttribute('data-tex',tex);
  if(mode==='edit')m.contentEditable='false';
  renderMath(m);return m;
}
function rich(str,mode){
  mode=mode||'view';
  var doc=new DOMParser().parseFromString('<body>'+(str||'')+'</body>','text/html'),f=document.createDocumentFragment();
  (function walk(n,out,inA){
    n.childNodes.forEach(function(c){
      var t,e,u,k;
      if(c.nodeType===3){
        if(inA||mode!=='view'){out.append(c.textContent);return}
        c.textContent.split(/(https?:\/\/[^\s<>"]+)/).forEach(function(p,i){if(p)out.append(i%2?link(p,p):p)});
        return;
      }
      if(c.nodeType!==1)return;
      t=c.tagName;
      if(t==='BR'){out.append(document.createElement('br'));return}
      if(t==='M'||(t==='SPAN'&&c.hasAttribute('data-tex'))){
        out.append(mode==='plain'?'[rumus]':mathEl(t==='M'?c.textContent:c.getAttribute('data-tex'),c.hasAttribute('data-d'),mode));return;
      }
      if(t==='IMG'){u=c.getAttribute('src')||'';if(OKIMG.test(u)){e=document.createElement('img');e.src=u;e.alt='';e.loading='lazy';out.append(e)}return}
      if(t==='A'){u=c.getAttribute('href')||'';if(/^https?:\/\//i.test(u)&&!inA){e=link(u);walk(c,e,true);out.append(e)}else walk(c,out,inA);return}
      k=TAGS[t];
      if(!k){walk(c,out,inA);return}
      e=document.createElement(k);styled(c,e);
      if(k==='span'&&!e.getAttribute('style')){walk(c,out,inA);return}
      walk(c,e,inA||k==='pre'||k==='code');out.append(e);
      if(mode==='plain'&&/^(div|p|li|h2|h3|blockquote|pre)$/.test(k))out.append(' ');
    });
  })(doc.body,f,false);
  return f;
}
function plain(str){
  var d=document.createElement('div');d.append(rich(str,'plain'));
  var t=d.textContent.replace(/\s+/g,' ').trim();if(d.querySelector('img'))t+=(t?' ':'')+'[foto]';
  return t.length>220?t.slice(0,220)+'…':t;
}
function toPhoto(file){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var k=Math.min(1,800/Math.max(img.width,img.height)),c=document.createElement('canvas'),x;
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72));
    };
    img.onerror=function(){rej(new Error('bad image'))};
    img.src=url;
  });
}
function makeRte(html,ph){
  var saved=null,editing=null,pd=function(e){e.preventDefault()};
  var ed=h('div',{class:'ed',contenteditable:'true',role:'textbox','aria-multiline':'true','data-ph':ph||'Tulis catatan…'});
  ed.append(rich(html,'edit'));
  function keep(){var s=window.getSelection();if(s.rangeCount&&ed.contains(s.anchorNode))saved=s.getRangeAt(0).cloneRange()}
  function back(){ed.focus();var s=window.getSelection();if(saved){s.removeAllRanges();s.addRange(saved)}return s}
  function ex(c,v,css){document.execCommand('styleWithCSS',false,!!css);document.execCommand(c,false,v);document.execCommand('styleWithCSS',false,false);keep()}

function openForm(o){

      if(f.required&&!String(out[f.name]).trim()){inputs[f.name].focus();toast(f.label+' wajib diisi');return}
    }
    dlg.close();o.onSave(out);
  }},h('h3',{},o.title));

      }});

      form.append(prev,h('div',{class:'row'},file,rm));

      var rt=makeRte(f.value||'',f.placeholder);inputs[f.name]=rt;form.append(rt.el);

        ?h('textarea',{id:id,rows:f.rows||5,placeholder:f.placeholder||''})
        :h('input',{type:'text',id:id,placeholder:f.placeholder||'',autocomplete:'off'});
      el.value=f.value||'';inputs[f.name]=el;form.append(el);

function offsetOf(container,node,off){
  var r=document.createRange();r.selectNodeContents(container);r.setEnd(node,off);return r.toString().length;
}
document.addEventListener('selectionchange',function(){
  var lyr=$('#lyrics'),bar=$('#selbar');
  if(!lyr||!current){return}
  var hide=function(){bar.hidden=true;pending=null};
  var sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.isCollapsed)return hide();
  var r=sel.getRangeAt(0);
  if(!lyr.contains(r.startContainer)||!lyr.contains(r.endContainer))return hide();
  var a=offsetOf(lyr,r.startContainer,r.startOffset),b=offsetOf(lyr,r.endContainer,r.endOffset);
  var t=current.lyrics.slice(a,b);
  a+=t.length-t.replace(/^\s+/,'').length;
  b-=t.length-t.replace(/\s+$/,'').length;
  if(b<=a)return hide();
  pending={start:a,end:b};
  $('#selprev').textContent=current.lyrics.slice(a,b).replace(/\s+/g,' ');
  bar.hidden=false;
});

$('#selbtn').addEventListener('click',function(){

    toast('Bagian ini sudah punya catatan. Pilih bagian lain.');return;

    fields:[{name:'text',label:'Terjemahan atau catatan',type:'rich',required:true,placeholder:'Tulis artinya, penjelasan kata, atau tata bahasanya'}],

      save();window.getSelection().removeAllRanges();$('#selbar').hidden=true;pending=null;
      renderLyrics(song,$('#lyrics'));viewSong(song);
    }});
});

    {name:'lyrics',label:'Lirik (tempel di sini)',type:'textarea',rows:12,required:true}],
    onSave:function(v){

function editSong(s){
  openForm({title:'Ubah lagu',fields:[
    {name:'title',label:'Judul lagu',type:'text',required:true,value:s.title},
    {name:'lyrics',label:'Lirik',type:'textarea',rows:12,required:true,value:s.lyrics}],
    onSave:function(v){
      var lyr=v.lyrics.replace(/\r\n?/g,'\n').replace(/\s+$/,''),before=s.notes.length,kept=[];
      s.notes.slice().sort(function(a,b){return a.start-b.start}).forEach(function(n){
        var st=lyr.slice(n.start,n.end)===n.quote?n.start:lyr.indexOf(n.quote);
        if(st<0)return;
        var last=kept[kept.length-1];
        if(last&&st<last.end)return;
        n.start=st;n.end=st+n.quote.length;kept.push(n);
      });
      s.title=v.title.trim();s.lyrics=lyr;s.notes=kept;save();viewSong(s);
      if(kept.length<before)toast((before-kept.length)+' catatan dihapus karena teks liriknya berubah');
    }});
}

function sig(o){return JSON.stringify(o,function(k,v){return k==='u'?undefined:v})}
function ents(){var m={};db.albums.forEach(function(a){m['a:'+a.id]=a});db.songs.forEach(function(s){m['s:'+s.id]=s});return m}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){return false}}
function stamp(){
  var now=Date.now(),c=ents(),k;db.del=db.del||{};
  for(k in c){if(snap[k]!==sig(c[k])||db.del[k]){c[k].u=now;delete db.del[k];snap[k]=sig(c[k])}}
  for(k in snap){if(!c[k]){db.del[k]=now;delete snap[k]}}
}
(function(){
  var legacy=false,c,k,now=Date.now();
  try{legacy=!!localStorage.getItem(KEY)}catch(e){}
  db.del=db.del||{};c=ents();
  for(k in c){snap[k]=sig(c[k]);if(legacy&&c[k].u===undefined)c[k].u=now}
  if(legacy)persist();
})();

  if(!warned){warned=1;toast('Kata sandi sinkron dimasukkan di bagian bawah halaman.')}

  var r=await fetch('/api/sync'+(qs||''),{method:m,headers:{'x-key':KY,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){KY='';try{localStorage.removeItem(KEY+'-k')}catch(e){}askKey();throw 0}
  if(!r.ok)throw 1;
  return r.json();
}
function put(k,o){
  var arr=k.charAt(0)==='a'?db.albums:db.songs,id=k.slice(2),i=-1,old;
  arr.forEach(function(x,n){if(x.id===id)i=n});
  if(o.del){if(i>=0)arr.splice(i,1);db.del[k]=o.u;delete snap[k];return}
  delete db.del[k];
  if(i>=0){old=arr[i];Object.keys(old).forEach(function(p){delete old[p]});Object.assign(old,o)}else arr.push(o);
  snap[k]=sig(o);
}
function refresh(){
  if(!$('#sheet').hidden||!$('#selbar').hidden||document.querySelector('dialog')){later=1;return}
  later=0;var y=window.scrollY;go();window.scrollTo(0,y);
}
async function sync(){
  if(!KY)return askKey();
  if(busy){again=1;return}
  busy=1;
  try{
    var v=(await api('GET','?v=1')).v;
    var rem=(await api('GET')).idx||{},c=ents(),k,i,lu,pull=[],push={},changed=0;
    for(k in rem){lu=c[k]?(c[k].u||0):(db.del[k]||0);if(rem[k]>lu)pull.push(k)}
    for(k in c){if(c[k].u&&c[k].u>(rem[k]||0))push[k]=c[k]}
    for(k in db.del){if(!c[k]&&db.del[k]>(rem[k]||0))push[k]={id:k.slice(2),del:1,u:db.del[k]}}
    for(i=0;i<pull.length;i+=6){
      var it=(await api('GET','?k='+encodeURIComponent(pull.slice(i,i+6).join(',')))).items||{};
      for(k in it){put(k,it[k]);changed=1}
    }
    var batch={},size=0,n=0,len;
    var send=async function(){if(n){await api('PUT','',{items:batch});batch={};size=0;n=0}};
    for(k in push){len=JSON.stringify(push[k]).length;if(n&&size+len>3e6)await send();batch[k]=push[k];size+=len;n++}
    await send();
    if(changed){persist();refresh()}
    lastV=v;
    var d=new Date();st('Tersinkron pukul '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2));
  }catch(e){if(e!==0)st('Belum tersinkron. Data tetap aman di perangkat ini.')}
  busy=0;
  if(again){again=0;queue()}
}
async function poll(){
  if(!KY||document.hidden||busy)return;
  try{var v=(await api('GET','?v=1')).v;if(v!==lastV)sync();else if(later)refresh()}catch(e){}
}
function queue(){clearTimeout(tq);tq=setTimeout(sync,1200)}

/* ---------- router ---------- */
function go(){
  closeSheet();current=null;pending=null;held=null;$('#selbar').hidden=true;
  window.scrollTo(0,0);
  var p=location.hash.split('/'),page=p[1],id=p[2];
  if(page==='album'&&albumById(id))return viewAlbum(albumById(id));
  if(page==='lagu'&&songById(id))return viewSong(songById(id));
  viewHome();
}
window.addEventListener('hashchange',go);
go();
if(KY)sync();else askKey();
setInterval(poll,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)poll()});
window.addEventListener('online',function(){sync()});
})();
</script>
